# Stage prod1-2. One of the two prod zones that fan out from prod1-0. It promotes in
# parallel with its sibling once the canary zone has verified.
#
# The promotion renders manifests rather than editing them in place: it checks
# main out as the source and the stage/prod1-2 branch as the output, wipes the
# output, and renders the chart through this zone's values chain into the
# branch. main never changes, and the branch holds the entire desired state of
# prod1-2 -- no values left to merge, no tag left to substitute, which is what
# makes `git show stage/prod1-2:manifests.yaml` an honest answer to "what is
# running there?".
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod1-2
  namespace: microservice-delivery
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: podinfo
      sources:
        stages:
          - prod1-0

  promotionTemplate:
    spec:
      steps:
        # ./src is the source of truth; ./out is this zone's rendered branch.
        # create: true lets the first promotion start the branch as an orphan
        # if .bootstrap/kargo/up.sh has not seeded it.
        - uses: git-clone
          config:
            repoURL: https://github.com/koorikla/platform-engineering-backstack.git
            checkout:
              - branch: main
                path: ./src
              - branch: stage/prod1-2
                create: true
                path: ./out

        # The branch is output only, so it is rebuilt from empty every time.
        # Without this a resource dropped from the chart would linger in the
        # branch and Argo CD would happily keep applying it.
        - uses: git-clear
          config:
            path: ./out

        # The three values layers, narrowest last. The promoted tag arrives
        # through setValues rather than being written into a values file: it is
        # the one input that changes on every promotion, and the rendered branch
        # already records which tag was used.
        - uses: helm-template
          config:
            path: ./src/delivery/chart
            releaseName: podinfo
            namespace: prod1-2
            valuesFiles:
              - ./src/delivery/envs/prod/values-prod.yaml
              - ./src/delivery/envs/prod/prod1-2/values-cluster.yaml
            setValues:
              - key: image.tag
                value: ${{ imageFrom("ghcr.io/stefanprodan/podinfo").Tag }}
            outPath: ./out/manifests.yaml

        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: 'chore(prod1-2): render podinfo ${{ imageFrom("ghcr.io/stefanprodan/podinfo").Tag }}'

        - uses: git-push
          config:
            path: ./out

        # Waits for Argo CD to sync the commit just pushed and report the zone
        # healthy. Without it the verification below would run against whatever
        # the previous sync left behind -- Argo CD polls Git every three
        # minutes, so a quick analysis could pass on the old image.
        - uses: argocd-update
          config:
            apps:
              - name: podinfo-prod1-2
                namespace: argocd-system
                sources:
                  - repoURL: git@github.com:koorikla/platform-engineering-backstack.git
                    desiredRevision: ${{ outputs.commit.commit }}

  # The quality gate. Runs after the promotion lands and decides whether this
  # Freight becomes eligible downstream -- a failure here stops the rollout in
  # this zone rather than merely reporting it.
  verification:
    analysisTemplates:
      - name: podinfo-healthy
    args:
      - name: stage-namespace
        value: prod1-2
