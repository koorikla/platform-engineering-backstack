# @see https://marketplace.upbound.io/providers/upbound/provider-family-aws
# @see https://docs.localstack.cloud/user-guide/integrations/crossplane/
#
# ClusterProviderConfig (v2, group aws.m.upbound.io) is the cluster scoped
# config that namespaced managed resources can share. The alternative -- a
# namespaced ProviderConfig -- would need a copy in every tenant namespace.
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  endpoint:
    url:
      type: Static
      static: http://localstack.localstack-system.svc.cluster.local:4566
    services: [s3, sqs, ec2, iam, lambda, dynamodb] # the same ones that are in bootstrap/localstack/manifests/deployment.yaml
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-secret
      key: creds
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_requesting_account_id: true
  s3_use_path_style: true
