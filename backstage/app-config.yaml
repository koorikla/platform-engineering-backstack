app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

organization:
  name: My Company

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  # The hand-written CrossplaneEntityProvider was replaced by
  # kubernetes-ingestor, which leaves its previously-ingested entities in the
  # database owned by a provider that no longer exists. Without this they linger
  # forever and the catalog logs "Orphaned providers were thus:
  # 'crossplane-entity-provider'" on every startup.
  orphanProviderStrategy: delete
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    # kubernetes-ingestor emits Template and API entities per XRD in addition to
    # the Component/Resource entities for each XR, so both kinds must be allowed.
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # All Templates
    - type: url
      target: https://github.com/koorikla/platform-engineering-backstack/blob/main/backstage/catalog/all.yaml
      rules:
        - allow: [Template, System, User, Group]

    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../catalog/components.yaml

    # # Local example template
    # - type: file
    #   target: ../../examples/template/template.yaml
    #   rules:
    #     - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

# @see https://terasky-oss.github.io/backstage-plugins/plugins/kubernetes-ingestor/overview
# @see https://github.com/RoadieHQ/backstage-plugin-argo-cd
#
# Reached in-cluster over HTTPS. Argo CD serves a self-signed certificate whose
# SANs do include argocd-server.argocd-system.svc.cluster.local, so the hostname
# verifies -- only the issuer is untrusted. up.sh copies Argo CD's tls.crt into
# backstage-system and the deployment points NODE_EXTRA_CA_CERTS at it, which
# trusts exactly that one certificate rather than disabling TLS verification
# process-wide as NODE_TLS_REJECT_UNAUTHORIZED=0 would.
argocd:
  username: admin
  password: ${ARGOCD_PASSWORD}
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: platform
          url: https://argocd-server.argocd-system.svc.cluster.local
          username: admin
          password: ${ARGOCD_PASSWORD}

kubernetesIngestor:
  # Ingest from the single kind cluster this stack runs on.
  allowAllClusters: true

  # Emit API entities as type "openapi" with a generated OpenAPI spec rather
  # than the default type "crd", whose definition is the raw CRD YAML.
  # EntityApiDefinitionCard (already wired into the API entity page) renders an
  # openapi definition as browsable Swagger UI, so each XRD becomes real
  # documentation of the platform API instead of a schema dump.
  ingestAPIsAsCRDs: false

  # Without this the plugin owns entities as "kubernetes-auto-ingested" and
  # derives a System of the same name, neither of which exists -- every ingested
  # entity then shows "This entity has relations to other entities, which can't
  # be found in the catalog". `guests` is the Group defined in examples/org.yaml.
  defaultOwner: guests

  mappings:
    # `none` assigns a System only when a resource carries the
    # terasky.backstage.io/system annotation, and auto-creates no System entity.
    # The alternatives all synthesise a System reference (from namespace or
    # cluster name) that nothing in this catalog defines, which is what produced
    # the dangling system:default/kubernetes-auto-ingested relation.
    systemModel: none

  components:
    # Must stay true. `enabled: false` does not merely filter workloads -- it
    # short-circuits the whole KubernetesEntityProvider and removes everything it
    # already tracked, so Crossplane XRs stopped being ingested as well and only
    # the XRD-derived Templates and APIs remained.
    enabled: true

    # Keep the platform's own machinery out of the catalog while still ingesting
    # anything in a tenant namespace. The provider's filter is
    # `!excludedNamespaces.has(namespace)`, so tenant namespaces (team-a, team-b)
    # pass, so the XQueue XRs a team creates there are ingested.
    excludedNamespaces:
      - argocd-system
      - backstage-system
      - crossplane-system
      - crossview-system
      - kyverno-system
      - localstack-system
      - kube-system
      - kube-public
      - kube-node-lease
      - local-path-storage
      - default

  crossplane:
    enabled: true
    claims:
      # "Claims" is the plugin's historical name for the user-facing resource.
      # For a v2 XRD (spec.scope: Namespaced) the plugin ingests the XR itself,
      # since v2 has no claim to proxy through.
      ingestAllClaims: true
    xrds:
      enabled: true
      # Generate a scaffolder template per XRD rather than hand-maintaining one.
      ingestAllXRDs: true
      ingestOnlyAsAPI: false
      convertDefaultValuesToPlaceholders: true
      publishPhase:
        target: github
        allowedTargets:
          - github.com
        git:
          repoUrl: github.com?repo=platform-engineering-backstack&owner=koorikla
          targetBranch: main
          branchPrefix: feature/

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options
  frontend:
    podDelete:
      enabled: true
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: https://127.0.0.1:52484
          name: kind
          authProvider: 'serviceAccount'
          skipTLSVerify: true
          skipMetricsLookup: true
          serviceAccountToken: ${SERVICE_ACCOUNT_TOKEN}
          serviceAccountNamespace: backstage-system

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true
