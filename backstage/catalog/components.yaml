apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: backstage
  description: Represents the Backstage developer portal ecosystem.
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: infrastructure
  description: Manages infrastructure resources provisioned through Crossplane across environments and cloud accounts.
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: localstack
  description: Represents the local development environment that emulates AWS services through LocalStack for testing infrastructure provisioning and integrations.
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: argocd
  description: Represents the Argo CD system responsible for GitOps-based application deployment and continuous delivery workflows.
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: crossview
  description: Represents the Crossview system, offering a web-based UI to enhance the visibility and management of Crossplane resources.
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: kargo
  description: Represents the Kargo system, which promotes container images through the delivery pipeline by rendering manifests onto the per-zone stage branches.
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: Backstage is an internal developer portal that centralizes software components, documentation, and tools to streamline developer workflows.
  annotations:
    backstage.io/kubernetes-id: backstage
  links:
    - url: http://localhost:3000
      title: Backstage UI
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: backstage
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-postgres
  description: PostgreSQL database instance used to persist Backstage metadata and catalog information.
  annotations:
    backstage.io/kubernetes-id: backstage-postgres
spec:
  type: service
  lifecycle: production
  owner: guests
  system: backstage
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: localstack
  description: LocalStack simulates AWS cloud services locally, enabling development and testing of infrastructure components without requiring access to real AWS environments.
  annotations:
    backstage.io/kubernetes-id: localstack
  links:
    - url: http://localhost:4566
      title: LocalStack Endpoint
      icon: dashboard
    - url: https://app.localstack.cloud/instances
      title: LocalStack Web App
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: localstack
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: argocd-server
  description: Argo CD Server component responsible for providing the user interface and API server functionalities for managing application deployments through GitOps workflows.
  annotations:
    backstage.io/kubernetes-id: argocd-server
  links:
    - url: http://localhost:8080
      title: Argo CD UI
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: argocd
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossview
  description: Crossview provides a user-friendly interface for visualizing, managing, and interacting with Crossplane resources across clusters.
  annotations:
    backstage.io/kubernetes-id: crossview
  links:
    - url: http://localhost:3001
      title: Crossview UI
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: crossview
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossview-postgres
  description: PostgreSQL database instance used to persist Crossview data and application state.
  annotations:
    backstage.io/kubernetes-id: crossview-postgres
spec:
  type: service
  lifecycle: production
  owner: guests
  system: crossview
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kargo-api
  description: Kargo API and UI, which drives the progressive delivery pipeline -- promoting Freight through the dev, test and prod Stages and rendering each zone's manifests to its stage branch.
  annotations:
    backstage.io/kubernetes-id: kargo-api
  links:
    # https, not http: the API server terminates TLS with a self-signed
    # certificate, so the browser warns once on first visit.
    - url: https://localhost:3002
      title: Kargo UI
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: kargo

---
# kubernetes-ingestor hardcodes `system: "kubernetes-auto-ingested"` on the API
# entities it generates from XRDs -- it is a string literal in the plugin, not
# derived from kubernetesIngestor.mappings.systemModel, so no configuration
# removes it. Defining the System here resolves the relation instead of leaving
# every generated API entity reporting "This entity has relations to other
# entities, which can't be found in the catalog".
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: kubernetes-auto-ingested
  description: Entities discovered from the cluster by kubernetes-ingestor, including the API definitions generated from each Crossplane XRD.
spec:
  owner: guests
