apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage-system
  labels:
    app: backstage
    backstage.io/kubernetes-id: backstage
    backstage.io/kubernetes-namespace: backstage-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
        backstage.io/kubernetes-id: backstage
        backstage.io/kubernetes-namespace: backstage-system
    spec:
      serviceAccountName: backstage-user
      containers:
        - name: backstage
          image: backstage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - configMapRef:
                name: backstage-config
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: backstage-secrets
          env:
            - name: SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-token
                  key: token
            # Trust Argo CD's per-cluster self-signed certificate for the
            # argo-cd plugin, without the blast radius of
            # NODE_TLS_REJECT_UNAUTHORIZED=0, which would disable verification
            # for every outbound request including the GitHub API.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/argocd-ca/argocd-ca.crt
          volumeMounts:
            - name: argocd-ca
              mountPath: /etc/argocd-ca
              readOnly: true
      volumes:
        - name: argocd-ca
          configMap:
            name: argocd-ca
            # Backstage still starts if the bootstrap has not created this yet;
            # only the Argo CD plugin's TLS verification depends on it.
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: backstage-system
  labels:
    app: postgres
    backstage.io/kubernetes-id: backstage-postgres
    backstage.io/kubernetes-namespace: backstage-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        backstage.io/kubernetes-id: backstage-postgres
        backstage.io/kubernetes-namespace: backstage-system
    spec:
      containers:
        - name: postgres
          image: postgres:13.2-alpine
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: POSTGRES_HOST
              value: postgres.backstage-system
            - name: POSTGRES_PORT
              value: "5432"
