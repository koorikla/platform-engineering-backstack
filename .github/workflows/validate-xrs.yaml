name: Validate Crossplane XRs

on:
  pull_request:
    paths:
      - "crossplane/xrs/**/*.yaml"
      - "crossplane/xrs/**/*.yml"
      - "kyverno/**/*.yaml"
      - "kyverno/**/*.yml"

jobs:
  validate-xrs:
    name: Validate XR YAML with Kyverno
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: "v1.17.0"

      - name: Check install
        run: kyverno version

      - name: Run Kyverno policy checks on XRs
        run: |
          echo "## 🛡️ Kyverno Policy Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          set +e
          kyverno apply ./kyverno --resource ./crossplane/xrs 2>&1 | tee result.txt
          KYVERNO_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          cat result.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [[ $KYVERNO_EXIT_CODE -ne 0 ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ One or more Kyverno policies failed. Please fix the issues above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All policies passed." >> $GITHUB_STEP_SUMMARY
          fi
