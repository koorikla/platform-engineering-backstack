apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crossplane-system
  namespace: argocd-system
spec:
  generators:
    - list:
        elements:
          - name: namespaces
            path: crossplane/namespaces
            wave: "0"
          - name: providers
            path: crossplane/providers
            wave: "0"
          - name: providers-config
            path: crossplane/providers-config
            wave: "1"
          - name: functions
            path: crossplane/functions
            wave: "2"
          # The whole compositions tree, not just aws/ -- the template below
          # sets directory.recurse, so provider subdirectories (aws/,
          # kubernetes/, ...) are all picked up.
          - name: compositions
            path: crossplane/compositions
            wave: "3"
          - name: xrds
            path: crossplane/xrds
            wave: "4"
          # v2 replaces claims with namespaced XRs. These carry their own
          # metadata.namespace, so they must sync after crossplane/namespaces.
          - name: xrs
            path: crossplane/xrs
            wave: "5"

  template:
    metadata:
      name: crossplane-{{name}}
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: default
      source:
        repoURL: git@github.com:koorikla/platform-engineering-backstack.git
        targetRevision: HEAD
        path: "{{path}}"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
