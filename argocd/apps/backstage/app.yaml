apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-app
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: git@github.com:koorikla/platform-engineering-backstack.git
    targetRevision: HEAD
    path: .bootstrap/backstage/manifests
    directory:
      recurse: true
  # The backstage-secrets entry that used to live here never did anything: an
  # ignoreDifferences rule with no jsonPointers/jqPathExpressions/
  # managedFieldsManagers selects no fields, so nothing was ignored -- and it
  # could not have helped anyway, since the failure was the *apply* rejecting
  # `<placeholder>` as invalid base64, not a diff. That secret is now created
  # only by up.sh and is no longer part of this Application's source path.
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
