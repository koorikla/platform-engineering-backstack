apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-app
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.7.0
    helm:
      releaseName: kyverno
      valueFiles:
        - values.yaml
  # The chart renders `metadata.labels: {}` on its policy CRDs. Kubernetes drops
  # an empty map on write, so the live object simply has no labels key, and Argo
  # CD reports all 11 CRDs OutOfSync forever even though every sync succeeds.
  # The diff is exactly `> labels: {}` and nothing else.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
